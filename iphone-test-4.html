<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="UNBOUND — a culture, lifestyle and learning collective. Visual direction preview.">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="UNBOUND">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>UNBOUND — iPhone full-screen test 4</title>
  <style>
    :root { --brand:#FF5B5B; --nav-selected:#F4FF3A; --logo-width:62%; --nav-width:75%; --nav-weight:500; --nav-size:15px; color-scheme:dark; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; min-height:100%; background:#242424; }
    body { font-family:Arial,Helvetica,sans-serif; }
    button { font:inherit; cursor:pointer; }
    :focus-visible { outline:2px solid currentColor; outline-offset:5px; }
    [hidden] { display:none !important; }
    /* Track browser toolbar changes without moving the logo away from the photo seam. */
    .stage { position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden; isolation:isolate; }
    .photographs { position:absolute; inset:0; display:grid; grid-template-columns:1fr 1fr; }
    .photographs img { display:block; width:100%; height:100%; min-width:0; min-height:0; object-fit:cover; object-position:center; }
    .brand { position:absolute; z-index:1; top:50%; left:50%; width:var(--logo-width); height:auto; transform:translate(-50%,-50%); color:var(--brand); margin:0; pointer-events:none; }
    .brand svg { display:block; width:100%; height:auto; }
    .top-nav { position:absolute; z-index:2; top:0; left:50%; width:var(--nav-width); transform:translateX(-50%); display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:0; padding:calc(17px + env(safe-area-inset-top,0px)) 20px 17px; color:var(--brand); font-size:var(--nav-size); font-weight:var(--nav-weight); line-height:1.25; letter-spacing:.025em; text-align:center; }
    .top-nav button { appearance:none; border:0; padding:0; color:inherit; background:transparent; font:inherit; letter-spacing:inherit; line-height:inherit; white-space:nowrap; text-transform:uppercase; }
    .top-nav button[aria-pressed="true"] { color:var(--nav-selected); }
    .menu-toggle,.menu-close { appearance:none; display:none; width:48px; height:48px; padding:10px; border:0; background:transparent; color:var(--brand); align-items:center; justify-content:center; }
    .menu-toggle { position:absolute; z-index:4; top:calc(16px + env(safe-area-inset-top,0px)); left:calc(16px + env(safe-area-inset-left,0px)); }
    .menu-icon { position:relative; display:block; width:28px; height:22px; }
    .menu-icon span { position:absolute; left:0; width:28px; height:2px; background:currentColor; }
    .menu-icon span:nth-child(1) { top:1px; }
    .menu-icon span:nth-child(2) { top:10px; }
    .menu-icon span:nth-child(3) { top:19px; }
    /* An ordinary document overlay: no browser top layer or fixed backdrop. */
    .mobile-menu { position:absolute; z-index:5; inset:0; width:100%; height:100%; margin:0; padding:0; border:0; background:rgba(0,0,0,.5); color:var(--brand); }
    .mobile-menu-panel { position:absolute; top:var(--menu-top,0px); left:0; width:100%; height:var(--menu-height,100vh); display:flex; flex-direction:column; padding:calc(80px + env(safe-area-inset-top,0px)) 0 calc(32px + env(safe-area-inset-bottom,0px)); overflow-y:auto; overscroll-behavior:contain; }
    .menu-close { position:absolute; display:flex; top:calc(16px + env(safe-area-inset-top,0px)); left:calc(16px + env(safe-area-inset-left,0px)); }
    .menu-close .menu-icon span:first-child { top:10px; transform:rotate(45deg); }
    .menu-close .menu-icon span:last-child { top:10px; transform:rotate(-45deg); }
    .mobile-colours { width:min(80%,calc(100% - 32px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px))); margin:auto; display:flex; flex-shrink:0; flex-direction:column; gap:10px; }
    .mobile-colours button { appearance:none; display:block; width:100%; min-height:52px; padding:10px 0; border:0; background:transparent; color:inherit; text-align:left; }
    /* Same Helvetica Neue Condensed Bold outlines as the logo. A shared viewBox
       gives every label the same scale, with the longest fitting the 80% column. */
    .mobile-colours svg { display:block; width:100%; max-width:481.299px; height:auto; }
    .mobile-colours button[aria-pressed="true"] { color:var(--nav-selected); }
    .stage:has(.mobile-menu:not([hidden])) > :is(.brand,.menu-toggle) { visibility:hidden; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:960px) { .top-nav { grid-template-columns:repeat(3,minmax(0,1fr)); row-gap:16px; } }
    @media(max-width:767px), (max-width:1024px) and (hover:none) and (pointer:coarse) {
      :root { --logo-width:79.36%; overscroll-behavior-y:none; }
      /* Stable two-half canvas. Toolbar animation and scrolling never resize rows. */
      .stage { height:var(--mobile-hero-height,100vh); height:var(--mobile-hero-height,100lvh); }
      .menu-toggle { top:calc(var(--mobile-control-top,0px) + 16px + env(safe-area-inset-top,0px)); }
      /* Images fill the screen; only interactive controls receive safe-area spacing. */
      /* Absolute half-height boxes avoid Safari's replaced-grid-item sizing bug. */
      .photographs { display:block; }
      .photographs img { position:absolute; left:0; width:100%; height:50%; }
      .photographs img:first-child { top:0; }
      .photographs img:last-child { top:50%; }
      .top-nav { display:none; }
      .menu-toggle { display:flex; }
    }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      // This phone test starts at its calibrated opening position on reload.

      // EDIT HERE: replace the embedded photos with owned image paths, keeping src and alt.
      const photos = JSON.parse(document.getElementById('unbound-photos').textContent);
      const CONFIG = {

      const root = document.documentElement;
      const colourButtons = Array.from(document.querySelectorAll('[data-colour]'));
      const nav = document.getElementById('top-nav');
      const images = { left:document.getElementById('photo-left'), right:document.getElementById('photo-right') };
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const mobileQuery = window.matchMedia('(max-width:767px), (max-width:1024px) and (hover:none) and (pointer:coarse)');
      const mobileMenu = document.getElementById('mobile-menu');
      const menuToggle = document.getElementById('menu-toggle');
      const menuClose = document.getElementById('menu-close');
      let mobile = mobileQuery.matches;
      const stage = document.querySelector('.stage');
      const coarsePointer = window.matchMedia('(pointer:coarse)');
      const testParams = new URLSearchParams(window.location.search);

        scrollFixture.setAttribute('aria-label','Temporary scroll test content');
        scrollFixture.style.cssText = 'min-height:1800px;padding:48px 10%;background:#111;color:#eee;font:18px/1.5 Arial,sans-serif;';

      // TEST 4 ONLY: use the supplied iPhone 16 Pro's 1206x2622 screen proportions.
      // Avoid relying on coarse-pointer detection or exact Screen API dimensions.
      // phone=off retains Test 2's generic sizing for comparison.
      const calibratedPhoneTest = testParams.get('phone') !== 'off';
      const diagnosticPanel = testParams.get('debug') === '1' ? document.createElement('pre') : null;
      if (diagnosticPanel) {

        diagnosticPanel.style.cssText = 'position:absolute;z-index:9;left:10%;width:80%;margin:0;padding:12px;background:rgba(0,0,0,.86);color:white;font:11px/1.45 monospace;white-space:pre-wrap;overflow-wrap:anywhere;pointer-events:none;';
        stage.appendChild(diagnosticPanel);
      }
      const background = [
        ...Array.from(stage.children).filter(element => element !== mobileMenu && element !== diagnosticPanel),
        ...Array.from(document.body.children).filter(element => element !== stage && !element.matches('script,style'))
      ];
      const inertBeforeMenu = new Map();
      let canvasSignature = '';
      let canvasFrame = 0;
      let startPosition = 0;

      function renderDiagnostics() {
        if (!diagnosticPanel) return;
        const viewport = window.visualViewport;
        const r = stage.getBoundingClientRect();
        const rows = Array.from(document.querySelectorAll('.photographs img')).map(el => Math.round(el.getBoundingClientRect().height));
        const num = value => Number.isFinite(value) ? Math.round(value * 100) / 100 : '?';
        diagnosticPanel.style.top = `${Math.max(0,window.scrollY - (r.top + window.scrollY)) + 76}px`;
        diagnosticPanel.textContent = [
          'UNBOUND · TEST 4 MEASUREMENTS',
          `Phone calibration: ${calibratedPhoneTest ? 'iPhone 16 Pro' : 'off'}`,
          `Screen: ${screen.width} × ${screen.height}; DPR ${devicePixelRatio}`,
          `Inner: ${innerWidth} × ${innerHeight}`,
          `Outer: ${outerWidth} × ${outerHeight}`,
          `Visual: ${num(viewport?.width)} × ${num(viewport?.height)}; scale ${num(viewport?.scale)}`,
          `Visual top: ${num(viewport?.offsetTop)}; page top: ${num(viewport?.pageTop)}`,
          `Root: ${document.documentElement.clientHeight}; document: ${document.documentElement.scrollHeight}`,
          `Scroll Y: ${num(scrollY)}; target: ${num(startPosition)}`,
          `Top boundary: ${num(topBoundary())}`,
          `Canvas: ${num(r.height)}; top: ${num(r.top)}`,
          `Photo heights: ${rows.join(' / ')}`,
          `Photo layout: ${getComputedStyle(document.querySelector('.photographs')).display}`,
          `Coarse pointer: ${coarsePointer.matches}`,
          `UA: ${navigator.userAgent}`
        ].join('\n');
      }
      function updateMenuPlacement() {
        if (!mobile) return;
        const viewport = window.visualViewport;
        const pageTop = viewport ? viewport.pageTop : window.scrollY;
        const height = viewport ? viewport.height : window.innerHeight;
        const stageTop = stage.getBoundingClientRect().top + window.scrollY;
        const top = Math.max(0, Math.min(pageTop - stageTop, stage.offsetHeight - 64));
        // The hamburger belongs to the hero and scrolls away with its imagery.
        stage.style.setProperty('--mobile-control-top', `${startPosition}px`);
        mobileMenu.style.setProperty('--menu-top', `${top}px`);
        mobileMenu.style.setProperty('--menu-height', `${Math.max(0, Math.min(height, stage.offsetHeight - top))}px`);
        renderDiagnostics();
      }

      function configureCanvas(resetPosition = false) {
        if (!mobile) {
          canvasSignature = '';
          stage.style.removeProperty('--mobile-hero-height');
          stage.style.removeProperty('--mobile-control-top');
          return;
        }
        const viewport = window.visualViewport;
        // Pinch zoom must not replace the orientation's original image geometry.
        if (canvasSignature && viewport && Math.abs(viewport.scale - 1) > .01) {
          updateMenuPlacement();
          return;
        }
        const portrait = window.innerHeight >= window.innerWidth;
        const screenWidth = Math.min(window.screen.width,window.screen.height);
        const screenHeight = Math.max(window.screen.width,window.screen.height);
        const screenMatchesPhone = coarsePointer.matches && Math.abs(window.innerWidth - (portrait ? screenWidth : screenHeight)) < 3;
        const signature = `${Math.round(window.innerWidth)}:${portrait}:${calibratedPhoneTest || screenMatchesPhone ? 'phone' : window.innerHeight}`;
        const changed = signature !== canvasSignature;
        if (changed) {
          canvasSignature = signature;
          const height = calibratedPhoneTest ? window.innerWidth * (portrait ? 874/402 : 402/874) : screenMatchesPhone ? (portrait ? screenHeight : screenWidth) : window.innerHeight;
          stage.style.setProperty('--mobile-hero-height', `${height}px`);

          // Original Test 2 calibration from the supplied physical-phone screenshots.
          // 402x874 iPhone 16 Pro: Safari content begins 62 CSS px below screen top.
          // This is NOT a universal Safari safe-area value. Other devices retain
          // visible-viewport centring until their physical geometry is measured.
          const measuredPhone = screenMatchesPhone && portrait && /iPhone/.test(navigator.userAgent) && screenWidth === 402 && screenHeight === 874;
          const visibleHeight = viewport ? viewport.height : window.innerHeight;
          startPosition = calibratedPhoneTest && portrait ? window.innerWidth * 62/402 : measuredPhone ? 62 : Math.max(0,(height - visibleHeight)/2);
          const topOverride = new URLSearchParams(window.location.search).get('top');
          if ((calibratedPhoneTest || screenMatchesPhone) && topOverride !== null && Number.isFinite(Number(topOverride))) {
            startPosition = Math.max(0,Math.min(150,Number(topOverride)));
          }
          stage.dataset.testCanvasHeight = String(height);
          stage.dataset.testStartPosition = String(startPosition);
        }
        if (changed || resetPosition) window.scrollTo(0,startPosition);
        updateMenuPlacement();
      }

      // Keep the opening view as the logical top of the page. Only movement ABOVE
      // that boundary is constrained; the rest of the document scrolls normally.
      function topBoundary() {
        const viewport = window.visualViewport;
        if (!mobile || !canvasSignature || (viewport && Math.abs(viewport.scale - 1) > .01)) return 0;
        const maximumScroll = Math.max(0,document.documentElement.scrollHeight - document.documentElement.clientHeight);
        return Math.min(startPosition,maximumScroll);
      }
      function enforceTopBoundary() {
        const boundary = topBoundary();
        if (boundary > 0 && window.scrollY < boundary - .5) window.scrollTo(0,boundary);
      }
      function isHeroGesture(event) {
        if (!mobile || !mobileMenu.hidden || event.defaultPrevented) return false;
        const viewport = window.visualViewport;
        if (viewport && Math.abs(viewport.scale - 1) > .01) return false;
        const target = event.target instanceof Element ? event.target : null;
        return target && !target.closest('.mobile-menu,input,textarea,select,[contenteditable]');
      }
      let lastTouchY = null;
      stage.addEventListener('touchstart',event => {
        lastTouchY = isHeroGesture(event) && event.touches.length === 1 ? event.touches[0].clientY : null;
      },{passive:true});
      stage.addEventListener('touchmove',event => {
        if (lastTouchY === null || event.touches.length !== 1 || !isHeroGesture(event)) {
          lastTouchY = null;
          return;
        }

          if (window.scrollY !== boundary) window.scrollTo(0,boundary);
        }

      stage.addEventListener('touchend',() => { lastTouchY = null; },{passive:true});
      stage.addEventListener('touchcancel',() => { lastTouchY = null; },{passive:true});
      stage.addEventListener('wheel',event => {

          event.preventDefault();
          if (window.scrollY !== boundary) window.scrollTo(0,boundary);
        }
      },{passive:false});

      function scheduleMenuPlacement() {
        if (canvasFrame) return;
        canvasFrame = requestAnimationFrame(() => {
          canvasFrame = 0;
          updateMenuPlacement();
        });
      }
      // Scrolling changes control placement and respects the top boundary; image geometry stays fixed.
      window.addEventListener('scroll',() => { enforceTopBoundary(); scheduleMenuPlacement(); },{passive:true});

      }

          inertBeforeMenu.set(element,element.inert);

      }
      function closeMenu() {

        if (mobile) menuToggle.focus({preventScroll:true});
        else nav.querySelector('[aria-pressed="true"]').focus({preventScroll:true});
        arm();
      }
      let colour = CONFIG.defaultColour;
      function setBrand() {
        root.style.setProperty('--brand',colour);
        root.style.setProperty('--nav-selected',colour==='#F4FF3A'?'#FF5B5B':'#F4FF3A');

      let timer = null;
      let deadline = 0;
      let remaining = CONFIG.cycleMs;

      function disarm() {
        if (timer !== null) {
          remaining = Math.max(0,deadline-performance.now());
          clearTimeout(timer);
          timer = null;
        }
      }
      function arm() {
        if (!ready || !playing || document.hidden || !mobileMenu.hidden || timer !== null) return;
        deadline = performance.now()+remaining;
        timer = setTimeout(advance,remaining);
      }
      function showPhoto(side,index) {
        // Keep the previous image if a replacement fails, rather than showing a blank panel.
        if (cache[index].naturalWidth > 0) {
          images[side].src = photos[index].src;
          images[side].alt = photos[index].alt;
          images[side].dataset.index = String(index);
        }
      }
      function advance() {
        timer = null;
        const sequence = nextSide === 'left' ? CONFIG.leftSequence : CONFIG.rightSequence;
        positions[nextSide] = (positions[nextSide]+1)%sequence.length;
        const index = sequence[positions[nextSide]];
        showPhoto(nextSide,index);
        if (nextSide === 'left') {
          nextSide = 'right';
          remaining = CONFIG.rightDelayMs;
        } else {
          nextSide = 'left';
          remaining = CONFIG.cycleMs-CONFIG.rightDelayMs;
        }
        arm();
      }
      images.left.dataset.index = String(CONFIG.leftSequence[0]);
      images.right.dataset.index = String(CONFIG.rightSequence[0]);
      mobileQuery.addEventListener('change',event => {
        mobile = event.matches;
        if (!mobile) closeMenu();
        configureCanvas();
      });
      menuToggle.addEventListener('click',openMenu);
      menuClose.addEventListener('click',closeMenu);
      mobileMenu.addEventListener('keydown',event => {
        if (event.key === 'Escape') {
          event.preventDefault();
          closeMenu();
          return;
        }
        if (event.key !== 'Tab') return;
        const controls = [menuClose,...mobileMenu.querySelectorAll('[data-colour]')];
        const first = controls[0],last = controls[controls.length-1];
        const panel = mobileMenu.querySelector('.mobile-menu-panel');
        if (event.shiftKey && (document.activeElement === first || !mobileMenu.contains(document.activeElement))) {
          event.preventDefault(); panel.scrollTop = panel.scrollHeight; last.focus({preventScroll:true});
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault(); panel.scrollTop = 0; first.focus({preventScroll:true});
        }
      });
      document.addEventListener('visibilitychange',() => { if (document.hidden) disarm(); else arm(); });
      reducedMotion.addEventListener('change',event => {
        playing = !event.matches;
        if (playing) arm(); else disarm();
      });
      window.addEventListener('pagehide',disarm);
      window.addEventListener('pageshow',arm);
      Promise.allSettled(cache.map(image => image.decode())).then(() => { ready=true; arm(); });
    })();
  </script>
</body>
</html>
